name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (leave blank to build only)"
        required: false
        default: ""
  push:
    branches:
      - Alpha
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "README*"
      - ".github/ISSUE_TEMPLATE/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-vendorhash.yml"
      - "scripts/update-nix-vendorhash.sh"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  openwrt-apk:
    name: OpenWrt APK (aarch64_cortex-a53)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url:
            'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Verify Go installation
        run: go version

      - name: Set version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION=$INPUT_VERSION
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION=$GITHUB_REF_NAME
          else
            VERSION="${GITHUB_REF_NAME,,}-smart-$(git rev-parse --short HEAD)"
            VERSION="${VERSION//\//-}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build OpenWrt APK
        env:
          MIHOMO_OUTPUT_DIR: dist
          MIHOMO_PACKAGE_ARCH: aarch64_cortex-a53
        run: MIHOMO_VERSION="$VERSION" ./scripts/build-openwrt-apk.sh

      - name: Archive OpenWrt APK
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-openwrt-apk-aarch64_cortex-a53
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Prerelease-Alpha
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="Prerelease-${GITHUB_REF_NAME}"
          git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          cat > "$RUNNER_TEMP/release.md" << EOF
          OpenWrt APK for aarch64_cortex-a53 (OpenWrt 25.12.x)
          Version: ${VERSION}
          Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}

          This is a Smart fork build (Smart Group support).
          Smart Group issues are not upstream issues.
          EOF
          gh release create "$TAG" dist/*.apk \
            --prerelease \
            --title "Mihomo ${GITHUB_REF_NAME} with Smart Group" \
            --notes-file "$RUNNER_TEMP/release.md"

      - name: Publish release
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag')
          || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.version != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.apk --clobber
          else
            gh release create "$VERSION" dist/*.apk \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
